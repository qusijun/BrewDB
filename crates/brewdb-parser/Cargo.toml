[package]
name = "brewdb-parser"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = [
    "std",
    "recursive-protection",
]
derive-dialect = ["sqlparser_derive"]
json_example = [
    "serde_json",
    "serde",
]
recursive-protection = [
    "std",
    "recursive",
]
std = []
visitor = ["sqlparser_derive"]

[dependencies]
bigdecimal = { version = "0.4.1", features = ["serde"], optional = true }
brewdb-common = { path = "../brewdb-common" }
log.workspace = true
recursive = { version = "0.1.1", optional = true }
serde = { version = "1.0", features = ["derive", "alloc"], optional = true, default-features = false }
serde_json = { version = "1.0", optional = true }
sqlparser_derive = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
